name = "savona-payments"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "savona-bookings"
# Replace with real D1 database_id after `wrangler d1 create savona-bookings`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
CHECKOUT_CURRENCY = "eur"
BOOKING_REF_PREFIX = "SV"
# Fallback only — authoritative prices live in catalogue.ts per product
BOOKING_PRICE_PER_GUEST_EUR = "149"
ORIGINATING_SITE = "savonashoreexcursions.com"
ORIGINATING_PORT = "Savona"
# Localhost until production domain + Pages are configured
SITE_BASE_URL = "http://localhost:3000"
SITE_ORIGIN = "http://localhost:3000"
CORS_ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://savonashoreexcursions.com,https://www.savonashoreexcursions.com"
INTERNAL_BOOKING_EMAIL = "info@wowatour.com"
EMAIL_FROM = "bookings@notifications.wowatour.com"
EMAIL_FROM_NAME = "Savona Shore Excursions"

# Secrets (set via `wrangler secret put` or `.dev.vars` — never commit):
# STRIPE_SECRET_KEY=sk_test_...
# STRIPE_WEBHOOK_SECRET=whsec_...
# RESEND_API_KEY=re_...
